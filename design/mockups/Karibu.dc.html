<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<title>Onboarding profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2362B}a:hover{color:#8F2219}
input{font-family:inherit}
input::placeholder{color:#8A8478}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F0; color: #1C1B19; font-family: 'Public Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div aria-hidden="true" style="height: 12px; flex: 0 0 auto; background: repeating-linear-gradient(45deg, #C2362B 0 6px, #FAF7F0 6px 12px); border-bottom: 2px solid #1C1B19"></div>

  <div style="flex: 1 1 auto; padding: 24px 22px 26px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700">
      <span style="color: #5E5A52">Hatua 1 kati ya 2</span>
      <span style="display: flex; gap: 4px"><span style="width: 28px; height: 6px; background: #1C1B19"></span><span style="width: 28px; height: 6px; background: #E4DDCC"></span></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 40px; line-height: 0.95; text-transform: uppercase">Karibu!</div>
      <div style="font-size: 16px; line-height: 1.45">Tujuane kidogo kabla hatujaanza kuchemsha bongo.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="jina" style="font-size: 14px; font-weight: 700">Tukuite nani?</label>
        <input id="jina" type="text" autocomplete="nickname" placeholder="mf. Amani" style="height: 52px; box-sizing: border-box; border: 2px solid #1C1B19; border-radius: 4px; background: #FFFFFF; padding: 0 14px; font-size: 17px; color: #1C1B19">
        <span style="font-size: 12px; color: #5E5A52">Jina hili litaonekana kwenye ligi.</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="email" style="font-size: 14px; font-weight: 700">Barua pepe</label>
        <input id="email" type="email" autocomplete="email" placeholder="jina@mfano.com" style="height: 52px; box-sizing: border-box; border: 2px solid #1C1B19; border-radius: 4px; background: #FFFFFF; padding: 0 14px; font-size: 17px; color: #1C1B19">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="umri" style="font-size: 14px; font-weight: 700">Una miaka mingapi?</label>
        <input id="umri" type="number" inputmode="numeric" min="5" max="120" placeholder="mf. 24" style="height: 52px; width: 140px; box-sizing: border-box; border: 2px solid #1C1B19; border-radius: 4px; background: #FFFFFF; padding: 0 14px; font-size: 17px; color: #1C1B19">
      </div>

      <div style="background: #F2C230; border: 2px solid #1C1B19; border-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 800">Kwa nini tunauliza umri?</span>
        <span style="font-size: 13px; line-height: 1.45">Ili tukuletee maswali, nyimbo na filamu zinazofaa umri wako. Chini ya miaka 13? Tutaomba ruhusa ya mzazi.</span>
      </div>
    </div>

    <a href="Kiwango.dc.html" style="margin-top: auto; background: #C2362B; color: #FFFFFF; border: 2px solid #1C1B19; border-radius: 4px; min-height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Archivo', sans-serif; font-stretch: 112%; font-size: 17px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; text-decoration: none">Endelea</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

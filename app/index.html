<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Chemsha Bongo Beta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column on a kanga-dotted backdrop; rounded, pressable pieces; a wavy kanga band on top. Single light theme by choice. */
:root{
  --paper:#FBF6EC; --card:#FFFFFF; --ink:#24211C; --muted:#655E52; --line:#E7DDC9;
  --red:#C2362B; --red-deep:#8F2219; --sun:#F2C230; --sun-deep:#B8900F;
  --leaf:#2E7D4F; --leaf-deep:#1D5A37; --sky:#D7EDF2; --sky-deep:#3F7F91;
  --blush:#FBE4DE; --leaf-tint:#E3F1E6; --sun-tint:#FDF1C8;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  color-scheme:light;
}
html,body{height:100%}
body{
  background-color:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.45;
  background-image:radial-gradient(circle at 1px 1px, rgba(194,54,43,.13) 1.4px, transparent 1.6px);
  background-size:22px 22px;
}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.app{
  max-width:460px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column;
  background:var(--paper);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 28px;
  box-shadow:0 0 0 1px var(--line);
}
.band{display:block;height:22px;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));}
.band svg{display:block;width:100%;height:22px}

.screen{display:flex;flex-direction:column;gap:18px;padding-top:14px;animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
.stack{display:flex;flex-direction:column;gap:8px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* type */
.h1{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(30px,8.4vw,40px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.15;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:0;max-width:60ch}
.fine{font-size:13px;color:var(--muted);margin:0;text-align:center}
.muted{color:var(--muted)}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:54px;padding:0 22px;border-radius:999px;border:none;cursor:pointer;
  background:var(--red);color:#FFFFFF;
  font-family:var(--display);font-stretch:112%;font-weight:800;font-size:16px;letter-spacing:.03em;text-transform:uppercase;
  box-shadow:0 5px 0 var(--red-deep);transition:transform .12s ease, box-shadow .12s ease, opacity .2s;
  text-decoration:none;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-deep)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-deep)}
.btn.sun:active{box-shadow:0 1px 0 var(--sun-deep)}
.btn.leaf{background:var(--leaf);box-shadow:0 5px 0 var(--leaf-deep)}
.btn.leaf:active{box-shadow:0 1px 0 var(--leaf-deep)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ghost:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.small{min-height:44px;padding:0 18px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.link{background:none;border:none;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;cursor:pointer;padding:0;text-align:left}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:0 0 auto}
.iconbtn svg{width:20px;height:20px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip.flame svg{color:var(--red)}
.chip.flame.on{background:var(--sun);box-shadow:none}
.chip.star svg{color:var(--sun-deep)}
.tag{align-self:flex-start;background:var(--sky);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.lvl{display:inline-block;background:var(--sun);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input{height:54px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:0 16px;font-size:17px;transition:border-color .15s, box-shadow .15s}
.field input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 4px var(--sun-tint)}
.field .hint{font-size:13px;color:var(--muted)}
.field input.age{width:9em}
.note{background:var(--sun-tint);border-radius:var(--r-md);padding:14px 16px;font-size:14px;line-height:1.45}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;background:var(--blush);border-radius:var(--r-md);padding:14px 16px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--red);flex:0 0 auto;margin:0}
.err{color:var(--red-deep);font-size:14px;font-weight:700;margin:0}
.err:empty{display:none}

/* choice cards */
.choices{display:flex;flex-direction:column;gap:12px}
.choice{position:relative;display:block;border-radius:var(--r-md);background:var(--card);box-shadow:inset 0 0 0 2px var(--line);padding:16px 18px;cursor:pointer;transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .15s, background .15s}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice:hover{transform:translateY(-2px)}
.choice:has(input:checked){background:var(--sun);box-shadow:inset 0 0 0 2.5px var(--ink);transform:rotate(-.7deg)}
.choice:has(input:focus-visible){outline:3px solid var(--red);outline-offset:2px}
.choice .ctitle{font-family:var(--display);font-stretch:112%;font-weight:900;font-size:22px;text-transform:uppercase;display:block}
.choice .csw{display:block;font-size:15px;margin-top:2px}
.choice .cen{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.choice:has(input:checked) .cen{color:var(--ink)}
.avgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.avgrid .choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;text-align:center;font-weight:700;font-size:14px}
.selfie-btn{display:flex;align-items:center;justify-content:center;gap:8px}
.selfie-btn input{position:absolute;width:1px;height:1px;opacity:0}

/* avatars */
.av{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--sun-tint);flex:0 0 auto}
.av svg{width:100%;height:100%}
img.av{object-fit:cover}
.av.sm{width:48px;height:48px}
.av.xs{width:34px;height:34px}
.av.initial{background:var(--red);color:#FFFFFF;font-family:var(--display);font-weight:900;font-size:28px}
.av.sm.initial{font-size:22px}
.av.xs.initial{font-size:15px}
.av.big{width:136px;height:136px;font-size:60px;box-shadow:0 0 0 5px var(--sun),0 0 0 10px var(--red)}

/* scene art */
.scene{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--sky);line-height:0}
.scene svg{width:100%;height:auto;display:block}
.scene-label{position:absolute;left:14px;top:12px;line-height:1.2;background:var(--card);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.cloud{animation:drift 22s linear infinite}
.cloud.c2{animation-duration:30s;animation-delay:-9s}
.sun-glow{transform-origin:292px 38px;animation:breathe 4s ease-in-out infinite}

/* home */
.homehead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.avbtn{border:none;background:none;padding:0;cursor:pointer;border-radius:50%}
.who{display:flex;flex-direction:column;gap:3px;min-width:0}
.who .hi{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minis{display:flex;gap:6px}
.wordmark{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(34px,10vw,46px);line-height:.9;text-transform:uppercase;margin:0;letter-spacing:-.01em}
.wordmark span{color:var(--red)}
.nudge{margin:0;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.nudge svg{width:18px;height:18px;color:var(--red);flex:0 0 auto}
.daily{position:relative;background:var(--red);color:#FFFFFF;border-radius:var(--r-lg);padding:18px 20px 22px;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.daily .eyebrow{color:#FFE7A6}
.daily q{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.2;quotes:none}
.daily small{font-size:13px;opacity:.92}
.daily::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:radial-gradient(circle at 6px 8px, var(--sun) 3px, transparent 3.5px) 0 0/16px 8px repeat-x}

.modes{display:flex;flex-direction:column;gap:14px}
.mode{position:relative;border-radius:var(--r-lg);padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:2px 14px;align-items:center;overflow:hidden;animation:enter .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.mode h3{margin:0;font-family:var(--display);font-stretch:112%;font-weight:900;font-size:21px;line-height:1.05;text-transform:uppercase}
.mode p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.mode .art{grid-column:2;grid-row:1 / span 3;width:92px;height:92px;border-radius:22px;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mode .art svg{width:100%;height:100%;display:block}
.mode:hover .art{transform:rotate(-5deg) scale(1.06)}
.mode .acts{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mode .best{font-size:12px;font-weight:700;color:var(--muted)}
.m-methali{background:var(--sun-tint)}
.m-geo{background:var(--sky)}
.m-mazao{background:var(--leaf-tint)}
.m-heads{background:var(--blush)}
.m-chora{background:var(--card);box-shadow:inset 0 0 0 2px var(--line)}
.soon{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.soon span{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);color:var(--muted)}

/* nav */
.nav{position:sticky;bottom:0;margin-top:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--paper);border-top:2px solid var(--line);padding-block:8px calc(8px + env(safe-area-inset-bottom, 0px));margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));z-index:5}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-height:48px;cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:800}
.nav button[aria-current="page"] svg{color:var(--red)}

/* how-to */
.howart{border-radius:var(--r-lg);overflow:hidden;line-height:0;display:grid;place-items:center;padding:16px}
.howart svg{width:min(220px,64%);height:auto}
.howart.wide{padding:0}
.howart.wide svg{width:100%}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:s;animation:enter .4s both;animation-delay:calc(var(--i,0) * 80ms)}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-weight:900}
.en-sum{font-size:14px;color:var(--muted);background:var(--card);border-radius:var(--r-md);padding:12px 14px;box-shadow:inset 0 0 0 2px var(--line);margin:0}

/* game chrome */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.count{font-family:var(--display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px}
.dots span{flex:1;height:7px;border-radius:999px;background:var(--line);transition:background .3s}
.dots .ok{background:var(--leaf)}
.dots .no{background:var(--red)}
.dots .now{background:var(--ink)}
.timer{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--sun);border-radius:inherit}
.timer.low i{background:var(--red)}

/* quiz */
.qcard{position:relative;background:var(--card);border-radius:var(--r-lg);padding:22px;box-shadow:0 14px 30px -20px rgba(36,33,28,.45);display:flex;flex-direction:column;gap:10px}
.qtext{font-family:var(--display);font-weight:800;font-size:clamp(23px,6.4vw,28px);line-height:1.18;margin:0;text-wrap:balance}
.blank{display:inline-block;min-width:3.6em;border-bottom:3px dashed var(--red);color:var(--leaf);text-align:center}
.blank.fill{border-bottom-style:solid;border-color:var(--leaf);animation:pop .4s}
.opts{display:grid;gap:10px}
.opt{border-radius:var(--r-md);background:var(--card);border:2px solid var(--line);padding:14px 18px;min-height:56px;text-align:left;font-size:17px;font-weight:700;cursor:pointer;transition:transform .15s, border-color .15s, background .2s, opacity .3s;animation:enter .35s both;animation-delay:calc(var(--i,0) * 60ms);display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--leaf);border-color:var(--leaf);color:#FFFFFF;animation:bump .45s}
.opt.wrong{background:var(--blush);border-color:var(--red);color:var(--red-deep);animation:shake .4s}
.opt.gone{opacity:.25;transform:scale(.97)}
.opt svg{width:20px;height:20px;flex:0 0 auto}
.feedback{border-radius:var(--r-md);padding:14px 16px;background:var(--leaf-tint);animation:enter .35s both;display:flex;flex-direction:column;gap:6px;font-size:15px}
.feedback.bad{background:var(--blush)}
.feedback b.big{font-family:var(--display);font-weight:900;font-size:19px}
.floater{position:absolute;right:18px;top:14px;font-family:var(--display);font-weight:900;font-size:24px;color:var(--leaf);pointer-events:none;animation:floatup 1.1s ease-out forwards}

/* mazao */
.crop{position:relative;background:var(--leaf-tint);border-radius:var(--r-lg);display:grid;place-items:center;padding:14px;overflow:hidden}
.crop svg{width:min(230px,66%);height:auto;transition:filter .6s ease, transform .7s cubic-bezier(.2,.8,.2,1)}
.crop.wilt svg{filter:grayscale(1) sepia(.5) brightness(.9) !important;transform:rotate(-9deg) translateY(12px) scale(.95)}
.crop.win svg{animation:sway 1.2s ease-in-out 2}
.drops{position:absolute;right:14px;top:12px;display:flex;gap:3px}
.drops svg{width:18px;height:22px;color:var(--sky-deep);transition:opacity .3s, transform .3s}
.drops .gone{opacity:.2;transform:scale(.6)}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.slot{width:34px;height:46px;border-bottom:3px solid var(--ink);font-family:var(--display);font-weight:900;font-size:26px;display:grid;place-items:center}
.slot.show{animation:pop .35s}
.slot.missed{color:var(--red)}
.kbd{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.key{height:46px;border-radius:12px;border:none;background:var(--card);box-shadow:0 3px 0 var(--line), inset 0 0 0 2px var(--line);font-weight:800;font-size:17px;cursor:pointer;transition:transform .1s, background .2s}
.key:active:not(:disabled){transform:translateY(2px)}
.key.hit{background:var(--leaf);color:#FFFFFF;box-shadow:none}
.key.miss{background:var(--line);color:var(--muted);box-shadow:none}
.hints{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hint{border-radius:var(--r-md);background:var(--card);border:none;box-shadow:inset 0 0 0 2px var(--line);padding:10px 12px;text-align:left;font-size:13px;font-weight:800;min-height:48px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.hint span{font-weight:500;font-size:13px;line-height:1.35}
.hint.open{background:var(--sun-tint);box-shadow:none;cursor:default;animation:pop .3s}

/* heads up */
.hu{border-radius:var(--r-lg);background:var(--red);color:#FFFFFF;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:26px 20px;transition:background .25s}
.hu .cat{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.hu .word{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(34px,10vw,54px);line-height:.98;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.hu.flip .word{animation:flipin .35s cubic-bezier(.2,.8,.2,1)}
.hu.ok{background:var(--leaf)}
.hu.pass{background:var(--sun);color:var(--ink)}
.bigcount{font-family:var(--display);font-weight:900;font-size:110px;line-height:1;text-align:center;color:var(--red);animation:pop .5s}
.wordlist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.wordlist li{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;background:var(--leaf-tint)}
.wordlist li.p{background:var(--line);color:var(--muted)}
.wordlist svg{width:14px;height:14px}

/* chora */
.wordbox{background:var(--ink);color:var(--paper);border-radius:var(--r-lg);padding:22px;text-align:center;display:flex;flex-direction:column;gap:6px;min-height:150px;justify-content:center}
.wordbox .w{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:38px;text-transform:uppercase;line-height:1}
.wordbox .w.hide{filter:blur(14px);user-select:none}
.holdbtn{touch-action:none;user-select:none;-webkit-user-select:none}
.pad{position:relative;background:#FFFFFF;border-radius:var(--r-lg);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden;aspect-ratio:1 / 1;max-width:100%}
.pad canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.swatches{display:flex;gap:8px}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border-radius:var(--r-md);padding:12px 14px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:800}
.team.now{background:var(--sun);box-shadow:none}
.team b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}

/* results */
.celebrate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:10px}
.celebrate .av.big{animation:hop 1.1s ease-in-out infinite}
.celebrate.calm .av.big{animation:none;box-shadow:0 0 0 5px var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.stat{background:var(--card);border-radius:var(--r-md);padding:12px 8px;text-align:center;box-shadow:inset 0 0 0 2px var(--line);animation:enter .4s both;animation-delay:calc(var(--i,0) * 90ms + .2s)}
.stat b{display:block;font-family:var(--display);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:700;color:var(--muted)}
.dayup{display:flex;gap:10px;align-items:center;background:var(--sun);border-radius:var(--r-md);padding:12px 16px;font-weight:800;width:100%;animation:bump .6s .5s both}
.dayup svg{width:26px;height:26px;color:var(--red);animation:wiggle 1s ease-in-out .6s 2}

/* league */
.table{display:flex;flex-direction:column;gap:4px}
.lrow{display:grid;grid-template-columns:28px 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;font-variant-numeric:tabular-nums}
.lrow .n{font-weight:800;color:var(--muted)}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lrow .pt{font-weight:800}
.lrow.top .n{color:var(--red)}
.lrow.me{background:var(--sun);animation:bump .6s .2s both}
.lrow.me .n,.lrow.me .nm{color:var(--ink);font-weight:800}
.cutline{display:flex;align-items:center;gap:10px;color:var(--red);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 0}
.cutline::before,.cutline::after{content:"";flex:1;border-top:2px dashed var(--red)}

/* profile */
.ptable{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:15px}
.ptable dt{color:var(--muted);font-weight:600}
.ptable dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.confirm{background:var(--blush);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:10px}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@keyframes enter{from{opacity:.15;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.6);opacity:.3}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-36px)}}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(380px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
@keyframes flipin{from{transform:rotateX(80deg) translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}70%{transform:rotate(4deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

<script>
const METHALI={"version":1,"mode":"malizia_methali","source":"Swahili Proverbs (Methali za Kiswahili), University of Illinois — Ambition section. Numbers are the source's entry numbers. Translations and meanings below are our own wording.","levels":["chipukizi","mjanja","dingi"],"notes":"Each question hides the 'blank' word. 'options' always contains the correct answer first; shuffle in the app. 'min_age' lets onboarding age filter content.","questions":[{"id":399,"text":"Daima mbele.","prompt":"Daima ___.","blank":"mbele","options":["mbele","nyuma","juu","chini"],"translation_en":"Always forward.","meaning_sw":"Usirudi nyuma; endelea kusonga mbele.","meaning_en":"Keep moving ahead, never backward.","level":"chipukizi","min_age":6,"theme":"bidii"},{"id":408,"text":"Jaribu uone.","prompt":"Jaribu ___.","blank":"uone","options":["uone","ulale","uende","ucheke"],"translation_en":"Try and you will see.","meaning_sw":"Huwezi kujua matokeo bila kujaribu.","meaning_en":"You only find out by trying.","level":"chipukizi","min_age":6,"theme":"bidii"},{"id":422,"text":"Kila mwanzo ni mzito.","prompt":"Kila mwanzo ni ___.","blank":"mzito","options":["mzito","mwepesi","mzuri","mrefu"],"translation_en":"Every beginning is heavy.","meaning_sw":"Kuanza jambo jipya huwa kugumu, lakini usikate tamaa.","meaning_en":"Starting anything is hard; push through it.","level":"chipukizi","min_age":6,"theme":"mwanzo"},{"id":389,"text":"Anayejitahidi hufaidi.","prompt":"Anayejitahidi ___.","blank":"hufaidi","options":["hufaidi","hulala","huchoka","hukimbia"],"translation_en":"Whoever strives, benefits.","meaning_sw":"Juhudi huleta faida.","meaning_en":"Effort pays off.","level":"chipukizi","min_age":6,"theme":"bidii"},{"id":425,"text":"Kila ufanyacho kifanye vema.","prompt":"Kila ufanyacho kifanye ___.","blank":"vema","options":["vema","haraka","kesho","polepole"],"translation_en":"Whatever you do, do it well.","meaning_sw":"Fanya kazi yako kwa ubora, hata kama ni ndogo.","meaning_en":"Put quality into everything you do.","level":"chipukizi","min_age":6,"theme":"bidii"},{"id":473,"text":"Tumaini hadi mwisho.","prompt":"Tumaini hadi ___.","blank":"mwisho","options":["mwisho","kesho","mwanzo","jioni"],"translation_en":"Hope until the end.","meaning_sw":"Usipoteze matumaini mpaka jambo liishe.","meaning_en":"Stay confident all the way to the finish.","level":"chipukizi","min_age":6,"theme":"matumaini"},{"id":392,"text":"Atakaye kufuga ng'ombe aanze na kuku.","prompt":"Atakaye kufuga ng'ombe aanze na ___.","blank":"kuku","options":["kuku","mbuzi","simba","samaki"],"translation_en":"Whoever wants to keep cattle should start with chickens.","meaning_sw":"Anza kidogo kabla ya kufikia makubwa.","meaning_en":"Don't look down on small beginnings.","level":"chipukizi","min_age":6,"theme":"mwanzo"},{"id":448,"text":"Mtaka cha mvunguni sharti ainame.","prompt":"Mtaka cha mvunguni sharti ___.","blank":"ainame","options":["ainame","aruke","alale","aombe"],"translation_en":"Whoever wants what is under the bed must bend down.","meaning_sw":"Vitu vizuri havipatikani kirahisi; lazima ujitahidi.","meaning_en":"Good things take effort to get.","level":"mjanja","min_age":8,"theme":"bidii"},{"id":449,"text":"Mtaka kilicho mbali hukitembelea.","prompt":"Mtaka kilicho mbali ___.","blank":"hukitembelea","options":["hukitembelea","hukisahau","hukiogopa","hukiacha"],"translation_en":"Whoever wants what is far away walks to it.","meaning_sw":"Ukitaka kitu kilicho mbali, fanya kila juhudi kukifikia.","meaning_en":"Distant goals need you to go after them.","level":"mjanja","min_age":8,"theme":"bidii"},{"id":406,"text":"Huwezi kujua ukiwezacho mpaka umejaribu.","prompt":"Huwezi kujua ukiwezacho mpaka ___.","blank":"umejaribu","options":["umejaribu","umelala","umesoma","umekula"],"translation_en":"You can't know what you can do until you've tried.","meaning_sw":"Uwezo wako hujulikana unapojaribu.","meaning_en":"You discover your ability by attempting things.","level":"mjanja","min_age":8,"theme":"bidii"},{"id":423,"text":"Kila ndege huruka kwa bawa lake.","prompt":"Kila ndege huruka kwa ___ lake.","blank":"bawa","options":["bawa","mguu","mdomo","mkia"],"translation_en":"Every bird flies with its own wing.","meaning_sw":"Kila mtu hufanya kulingana na uwezo wake.","meaning_en":"Everyone works within their own strengths.","level":"mjanja","min_age":8,"theme":"uwezo"},{"id":444,"text":"Msasi haogopi miiba.","prompt":"Msasi haogopi ___.","blank":"miiba","options":["miiba","mvua","giza","simba"],"translation_en":"A hunter isn't afraid of thorns.","meaning_sw":"Anayetaka kufanikiwa hapaswi kuogopa magumu.","meaning_en":"If you want success, don't fear the hard parts.","level":"mjanja","min_age":8,"theme":"ujasiri"},{"id":446,"text":"Mshoni hachagui nguo.","prompt":"Mshoni hachagui ___.","blank":"nguo","options":["nguo","sindano","rangi","uzi"],"translation_en":"A tailor doesn't choose the cloth.","meaning_sw":"Fanya kazi na kile ulicho nacho.","meaning_en":"Work with what you're given.","level":"mjanja","min_age":8,"theme":"uwezo"},{"id":431,"text":"Kulenga si kufuma.","prompt":"Kulenga si ___.","blank":"kufuma","options":["kufuma","kukosa","kurusha","kuona"],"translation_en":"Aiming is not hitting.","meaning_sw":"Kupanga si sawa na kufanikiwa; usishangilie mapema.","meaning_en":"A plan isn't a result. Don't celebrate too early.","level":"mjanja","min_age":8,"theme":"mipango"},{"id":395,"text":"Bahari haivukwi kwa kuogelea.","prompt":"Bahari haivukwi kwa ___.","blank":"kuogelea","options":["kuogelea","kutembea","kuruka","kusubiri"],"translation_en":"The ocean isn't crossed by swimming.","meaning_sw":"Kazi kubwa inahitaji njia na vifaa sahihi.","meaning_en":"Big goals need the right means, not just effort.","level":"mjanja","min_age":8,"theme":"mipango"},{"id":396,"text":"Banda likikushinda, jenga kibanda.","prompt":"Banda likikushinda, jenga ___.","blank":"kibanda","options":["kibanda","jumba","ghorofa","ukuta"],"translation_en":"If a hut is too much for you, build a shack.","meaning_sw":"Ukishindwa jambo kubwa, anza na dogo unaloliweza.","meaning_en":"Scale down to what you can manage.","level":"mjanja","min_age":8,"theme":"uwezo"},{"id":483,"text":"Unyoshe miguu kadiri ya kitanda.","prompt":"Unyoshe miguu kadiri ya ___.","blank":"kitanda","options":["kitanda","chumba","nyumba","mkeka"],"translation_en":"Stretch your legs to the length of your bed.","meaning_sw":"Tumia kulingana na uwezo wako.","meaning_en":"Live within your means.","level":"mjanja","min_age":8,"theme":"uwezo"},{"id":458,"text":"Mwanzo mateso, mwisho furaha.","prompt":"Mwanzo mateso, mwisho ___.","blank":"furaha","options":["furaha","huzuni","mateso","kilio"],"translation_en":"Hardship at the start, joy at the end.","meaning_sw":"Mwisho mzuri huja baada ya juhudi ngumu.","meaning_en":"A happy ending follows the hard work.","level":"mjanja","min_age":8,"theme":"matumaini"},{"id":490,"text":"Usipokubali kutia mguu majini hutavuka kijito.","prompt":"Usipokubali kutia mguu majini hutavuka ___.","blank":"kijito","options":["kijito","bahari","mlima","barabara"],"translation_en":"If you won't put your foot in the water, you won't cross the stream.","meaning_sw":"Lazima ukubali gharama ndogo ili ufike unakokwenda.","meaning_en":"You have to get your feet wet to get across.","level":"dingi","min_age":10,"theme":"ujasiri"},{"id":438,"text":"Mfupa uliomshinda fisi, mbwa atauweza?","prompt":"Mfupa uliomshinda ___, mbwa atauweza?","blank":"fisi","options":["fisi","simba","paka","kuku"],"translation_en":"The bone that beat the hyena, can a dog manage it?","meaning_sw":"Kama mwenye nguvu ameshindwa, mdhaifu atawezaje?","meaning_en":"If the strong couldn't do it, how will the weaker?","level":"dingi","min_age":10,"theme":"uwezo"},{"id":445,"text":"Mshale usio nyoya hauendi mbali.","prompt":"Mshale usio ___ hauendi mbali.","blank":"nyoya","options":["nyoya","ncha","upinde","rangi"],"translation_en":"An arrow without feathers won't go far.","meaning_sw":"Vitu vidogo vinaweza kuwa muhimu kwa mafanikio.","meaning_en":"Small details can make or break success.","level":"dingi","min_age":10,"theme":"mipango"},{"id":415,"text":"Kelele za chura hazimkatazi ng'ombe kunywa maji.","prompt":"Kelele za chura hazimkatazi ng'ombe kunywa ___.","blank":"maji","options":["maji","maziwa","uji","chai"],"translation_en":"The frog's noise doesn't stop the cow from drinking.","meaning_sw":"Usiache kazi yako kwa sababu ya maneno ya watu.","meaning_en":"Don't let others' noise stop you.","level":"dingi","min_age":10,"theme":"ujasiri"},{"id":443,"text":"Msafiri mbali, hupita jabali.","prompt":"Msafiri mbali, hupita ___.","blank":"jabali","options":["jabali","mto","soko","kijiji"],"translation_en":"The far traveller passes the mountain.","meaning_sw":"Mwenye nia ya kufika mbali hushinda vikwazo.","meaning_en":"Determination carries you past obstacles.","level":"dingi","min_age":10,"theme":"bidii"},{"id":480,"text":"Ukioka samaki, huwezi kuondoa manyoya ya kuku.","prompt":"Ukioka samaki, huwezi kuondoa manyoya ya ___.","blank":"kuku","options":["kuku","bata","njiwa","kanga"],"translation_en":"While baking fish, you can't pluck a chicken.","meaning_sw":"Fanya jambo moja kwa wakati mmoja.","meaning_en":"Do one thing at a time.","level":"dingi","min_age":10,"theme":"mipango"}],"excluded_from_source":{"reason":"Adult themes or crude wording; keep out of the general pool until an 18+ content tier exists.","ids":[403,424,435,466,468,489]}};
const GEO={"version":1,"mode":"unaijua","notes":"Questions are grouped by place. 'options' always has the correct answer first; shuffle in the app. Facts should be re-checked by a Tanzanian editor before launch, especially administrative boundaries, which change.","places":[{"name":"Dar es Salaam","zone":"Pwani","questions":[{"q":"Soko kubwa maarufu la Dar es Salaam ni lipi?","options":["Kariakoo","Kilombero","Mlango Mmoja","Majengo"],"level":"chipukizi","en":"What is Dar es Salaam's famous big market?"},{"q":"Makao makuu ya serikali yalihamia Dodoma kutoka mji gani?","options":["Dar es Salaam","Tanga","Arusha","Morogoro"],"level":"mjanja","en":"The seat of government moved to Dodoma from which city?"}]},{"name":"Kilimanjaro","zone":"Kaskazini","questions":[{"q":"Mlima mrefu zaidi barani Afrika uko mkoa gani?","options":["Kilimanjaro","Arusha","Tanga","Mbeya"],"level":"chipukizi","en":"Africa's highest mountain is in which region?"},{"q":"Makao makuu ya mkoa wa Kilimanjaro ni mji gani?","options":["Moshi","Arusha","Same","Hai"],"level":"mjanja","en":"What is the regional capital of Kilimanjaro?"}]},{"name":"Iringa","zone":"Nyanda za Juu Kusini","questions":[{"q":"Chifu gani wa Wahehe alipigana na Wajerumani?","options":["Mkwawa","Mirambo","Kinjikitile","Isike"],"level":"mjanja","en":"Which Hehe chief fought the Germans?"},{"q":"Hifadhi ya Taifa ya Ruaha iko karibu na mji gani?","options":["Iringa","Moshi","Tanga","Musoma"],"level":"mjanja","en":"Ruaha National Park is near which town?"}]},{"name":"Arusha","zone":"Kaskazini","questions":[{"q":"Mlima Meru uko mkoa gani?","options":["Arusha","Kilimanjaro","Manyara","Mbeya"],"level":"chipukizi","en":"Mount Meru is in which region?"},{"q":"Azimio la Arusha lilitangazwa mwaka gani?","options":["1967","1961","1964","1977"],"level":"dingi","en":"In what year was the Arusha Declaration made?"}]},{"name":"Dodoma","zone":"Kati","questions":[{"q":"Bunge la Tanzania liko mji gani?","options":["Dodoma","Dar es Salaam","Arusha","Morogoro"],"level":"chipukizi","en":"Tanzania's parliament sits in which city?"}]},{"name":"Mwanza","zone":"Ziwa","questions":[{"q":"Mwanza iko kando ya ziwa gani?","options":["Ziwa Victoria","Ziwa Tanganyika","Ziwa Nyasa","Ziwa Rukwa"],"level":"chipukizi","en":"Mwanza is on the shore of which lake?"}]},{"name":"Zanzibar (Unguja)","zone":"Visiwani","questions":[{"q":"Mji Mkongwe (Stone Town) uko kisiwa gani?","options":["Unguja","Pemba","Mafia","Kilwa Kisiwani"],"level":"chipukizi","en":"Stone Town is on which island?"},{"q":"Zanzibar inajulikana kwa zao gani la viungo?","options":["Karafuu","Kahawa","Pamba","Chai"],"level":"mjanja","en":"Zanzibar is famous for which spice crop?"}]},{"name":"Kigoma","zone":"Magharibi","questions":[{"q":"Hifadhi ya sokwe ya Gombe iko mkoa gani?","options":["Kigoma","Mara","Rukwa","Katavi"],"level":"mjanja","en":"Gombe chimpanzee park is in which region?"},{"q":"Stanley alikutana na Livingstone mahali gani?","options":["Ujiji","Tabora","Bagamoyo","Kilwa"],"level":"dingi","en":"Where did Stanley meet Livingstone?"}]},{"name":"Tanga","zone":"Kaskazini Mashariki","questions":[{"q":"Mapango ya Amboni yako mkoa gani?","options":["Tanga","Morogoro","Lindi","Pwani"],"level":"mjanja","en":"The Amboni Caves are in which region?"}]},{"name":"Lindi","zone":"Kusini","questions":[{"q":"Magofu ya Kilwa Kisiwani yako mkoa gani?","options":["Lindi","Mtwara","Pwani","Tanga"],"level":"dingi","en":"The Kilwa Kisiwani ruins are in which region?"}]},{"name":"Morogoro","zone":"Mashariki","questions":[{"q":"Milima ya Uluguru iko mkoa gani?","options":["Morogoro","Iringa","Tanga","Mbeya"],"level":"mjanja","en":"The Uluguru Mountains are in which region?"}]},{"name":"Serengeti","zone":"Kaskazini","questions":[{"q":"Serengeti inajulikana duniani kwa msafara wa mnyama gani?","options":["Nyumbu","Tembo","Twiga","Kiboko"],"level":"chipukizi","en":"Serengeti is world-famous for the migration of which animal?"}]}]};

const MAZAO={"version":1,"mode":"mazao","notes":"Crop guessing game (hangman style). 'word' is what the player spells. Hints: 'wapi' = where it is grown in Tanzania, 'nini' = what it is popular for. Have an agronomist or Tanzanian editor confirm growing regions before launch.","crops":[{"id":"mahindi","word":"MAHINDI","en":"maize","level":"chipukizi","wapi":"Hulimwa karibu kila mkoa; mikoa mikubwa ni Ruvuma, Mbeya, Rukwa na Iringa.","nini":"Unga wake hupikwa ugali, chakula kikuu cha Watanzania wengi.","en_fact":"Grown almost everywhere; its flour makes ugali."},{"id":"ndizi","word":"NDIZI","en":"banana","level":"chipukizi","wapi":"Kagera, Kilimanjaro, Mbeya na Arusha.","nini":"Hupikwa kama ndizi nyama au matoke, na huliwa zikiwa mbivu.","en_fact":"Cooked as ndizi nyama or matoke, or eaten ripe."},{"id":"nazi","word":"NAZI","en":"coconut","level":"chipukizi","wapi":"Pwani: Tanga, Pwani, Dar es Salaam, Lindi, Mtwara na Zanzibar.","nini":"Tui lake hupika wali wa nazi na mchuzi wa samaki.","en_fact":"Coconut milk cooks wali wa nazi and fish curry."},{"id":"chai","word":"CHAI","en":"tea","level":"chipukizi","wapi":"Iringa (Mufindi), Njombe, Mbeya (Rungwe) na Tanga (Lushoto).","nini":"Majani yake hutengeneza kinywaji cha kila asubuhi, chai ya maziwa au ya rangi.","en_fact":"Highland crop behind the everyday cup of chai."},{"id":"kahawa","word":"KAHAWA","en":"coffee","level":"mjanja","wapi":"Kilimanjaro, Kagera, Mbeya, Songwe na Ruvuma.","nini":"Kahawa ya miteremko ya Kilimanjaro inauzwa duniani kote.","en_fact":"A major export, famous from Kilimanjaro's slopes."},{"id":"pamba","word":"PAMBA","en":"cotton","level":"mjanja","wapi":"Kanda ya Ziwa: Shinyanga, Simiyu, Mwanza na Geita.","nini":"Nyuzi zake hutengeneza vitambaa, kanga na nguo.","en_fact":"Lake Zone crop; its fibre becomes cloth and kanga."},{"id":"mpunga","word":"MPUNGA","en":"rice (plant)","level":"mjanja","wapi":"Morogoro (Kilombero), Mbeya (Kyela na Mbarali) na Shinyanga.","nini":"Hukobolewa kuwa mchele wa wali. Mchele wa Kyela ni maarufu.","en_fact":"Husked into rice; Kyela rice is well known."},{"id":"muhogo","word":"MUHOGO","en":"cassava","level":"mjanja","wapi":"Mtwara, Lindi, Tanga, Pwani na Kanda ya Ziwa.","nini":"Huchomwa, hupikwa au husagwa kuwa unga. Majani yake ni kisamvu.","en_fact":"Roasted, boiled or milled; the leaves are kisamvu."},{"id":"alizeti","word":"ALIZETI","en":"sunflower","level":"mjanja","wapi":"Singida, Dodoma na Manyara.","nini":"Mbegu zake hukamuliwa mafuta ya kupikia.","en_fact":"Pressed for cooking oil in central Tanzania."},{"id":"korosho","word":"KOROSHO","en":"cashew","level":"dingi","wapi":"Mtwara na Lindi, pamoja na Pwani na Ruvuma.","nini":"Zao kubwa la biashara la kusini; Tanzania ni mmoja wa wazalishaji wakubwa Afrika.","en_fact":"The south's big cash crop; a major African producer."},{"id":"karafuu","word":"KARAFUU","en":"cloves","level":"dingi","wapi":"Pemba na Unguja, Zanzibar.","nini":"Kiungo maarufu cha Zanzibar, hutumika kwenye pilau na chai.","en_fact":"Zanzibar's famous spice, used in pilau and chai."},{"id":"mkonge","word":"MKONGE","en":"sisal","level":"dingi","wapi":"Tanga, Morogoro na Kilimanjaro.","nini":"Nyuzi zake hutengeneza kamba, magunia na mazulia.","en_fact":"Its fibre makes rope, sacks and mats."}]};

function kernels() {
  let s = '';
  for (let y = 42; y <= 158; y += 11) {
    const half = 28 * Math.sqrt(Math.max(0, 1 - Math.pow((y - 100) / 72, 2)));
    for (let x = 100 - half + 7; x <= 100 + half - 6; x += 10) s += `<circle cx="${x.toFixed(1)}" cy="${y}" r="4.3" fill="#E2A817"/>`;
  }
  return s;
}
function leaf(x, y, rot, len, fill) {
  len = len || 52; fill = fill || '#2E6B3F';
  return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0C${len * .3} -${len * .22} ${len * .72} -${len * .22} ${len} 0C${len * .72} ${len * .22} ${len * .3} ${len * .22} 0 0Z" fill="${fill}"/><path d="M2 0H${len - 4}" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="1.6"/></g>`;
}
function clove(x, y, r) {
  return `<g transform="translate(${x} ${y}) rotate(${r})"><path d="M-2.5 6L-1 62H1L2.5 6Z" fill="#6B3A1E"/><path d="M-11 6L0 -4L11 6L0 12Z" fill="#7A4424"/><circle cx="0" cy="-8" r="8" fill="#8B5130"/></g>`;
}
function boll(cx, cy, s) {
  const pts = [[-14, -6], [12, -9], [0, 11], [-12, 13], [14, 12]];
  let f = `<path d="M${cx} ${cy + 26 * s}l${-20 * s} ${8 * s} ${8 * s} ${-16 * s} ${-14 * s} ${-10 * s} ${18 * s} 2 ${8 * s} ${-14 * s} ${8 * s} ${14 * s} ${18 * s} -2 ${-14 * s} ${10 * s} ${8 * s} ${16 * s}Z" fill="#7A5230"/>`;
  pts.forEach(p => { f += `<circle cx="${cx + p[0] * s}" cy="${cy + p[1] * s}" r="${16 * s}" fill="#FFFFFF" stroke="#D9D2C3" stroke-width="2"/>`; });
  return f;
}

(function () {
  'use strict';
  const app = document.getElementById('app');
  const KEY = 'chemshabongo.beta.v1';
  const RANK = { chipukizi: 0, mjanja: 1, dingi: 2 };
  const LEVELS = [
    { id: 'chipukizi', name: 'Chipukizi', sw: 'Ndo unaanza. Maneno rahisi, methali maarufu, muda zaidi.', en: 'Beginner · just sprouting' },
    { id: 'mjanja', name: 'Mjanja', sw: 'Unajua mambo. Misemo ya mtaani, maswali magumu kidogo.', en: 'Amateur · street smart' },
    { id: 'dingi', name: 'Dingi', sw: 'Wewe ni mkongwe. Methali nzito, historia ya zamani, bila huruma.', en: 'Professional · the OG' }
  ];
  const AVATAR_IDS = ['simba', 'twiga', 'tembo', 'pundamilia'];

  /* ---------- state ---------- */
  function defaults() { return { profile: null, draft: null, points: 0, streakDays: 0, bestDays: 0, lastPlay: null, games: 0, best: {}, played: {} }; }
  let S = defaults();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(defaults(), JSON.parse(raw)); } catch (e) { /* storage blocked: play without saving */ }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

  /* ---------- helpers ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = n => Number(n || 0).toLocaleString('en-US');
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return ymd(d); };
  const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = sel => app.querySelector(sel);
  const $$ = sel => Array.from(app.querySelectorAll(sel));

  let cleanups = [];
  function addCleanup(f) { cleanups.push(f); }
  function go(fn, ...args) {
    cleanups.splice(0).forEach(f => { try { f(); } catch (e) { /* ignore */ } });
    fn(...args);
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
  }
  function countdown(ms, onTick, onEnd) {
    const start = performance.now(); let raf = 0, done = false;
    const loop = t => {
      if (done) return;
      const left = Math.max(0, ms - (t - start)); onTick(left);
      if (left <= 0) { done = true; onEnd(); return; }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    const stop = () => { done = true; cancelAnimationFrame(raf); };
    addCleanup(stop);
    return stop;
  }

  function liveStreak() {
    if (!S.lastPlay) return 0;
    return (S.lastPlay === ymd(new Date()) || S.lastPlay === yesterday()) ? S.streakDays : 0;
  }
  function bumpDaily() {
    const t = ymd(new Date());
    if (S.lastPlay === t) return false;
    S.streakDays = S.lastPlay === yesterday() ? S.streakDays + 1 : 1;
    S.lastPlay = t; S.bestDays = Math.max(S.bestDays || 0, S.streakDays);
    return true;
  }

  function avatar(p, cls) {
    p = p || S.profile; cls = cls || 'av';

    if (p.avatar === 'selfie' && p.selfie) return `<img class="${cls}" src="${p.selfie}" alt="Selfie ya ${esc(p.name)}">`;
    if (p.avatar === 'herufi') return `<span class="${cls} initial" role="img" aria-label="Herufi ya kwanza ya ${esc(p.name)}">${esc((p.name || '?').trim().charAt(0).toUpperCase())}</span>`;
    const a = ART.avatars[p.avatar] || ART.avatars.simba;
    return `<span class="${cls}" role="img" aria-label="Avatar ${a.name}">${a.svg}</span>`;
  }

  function pick(list, lvl, age, n, practice) {
    const r = practice ? 0 : RANK[S.profile.level] || 0;
    const a = S.profile.age || 99;
    const okAge = x => (age(x) || 0) <= a;
    let pool = list.filter(x => okAge(x) && RANK[lvl(x)] <= r && RANK[lvl(x)] >= r - 1);
    if (pool.length < n) pool = list.filter(x => okAge(x) && RANK[lvl(x)] <= Math.max(r, 1));
    if (pool.length < n) pool = list.filter(okAge);
    return shuffle(pool).slice(0, n);
  }

  /* ---------- quiz engine (methali + geo) ---------- */
  function startQuiz(kind, practice) {
    let items;
    if (kind === 'methali') {
      items = pick(METHALI.questions, q => q.level, q => q.min_age, practice ? 2 : 5, practice).map(q => ({
        prompt: q.prompt, answer: q.blank, options: q.options, eyebrow: 'Malizia methali',
        after: `<b class="big">${esc(q.text)}</b><span>${esc(q.meaning_sw)}</span><span class="muted">${esc(q.translation_en)} ${esc(q.meaning_en)}</span>`
      }));
    } else {
      const flat = [];
      GEO.places.forEach(pl => pl.questions.forEach(q => flat.push({ prompt: q.q, answer: q.options[0], options: q.options, eyebrow: `Unaijua ${pl.name}?`, level: q.level, en: q.en })));
      items = pick(flat, q => q.level, () => 0, practice ? 2 : 5, practice).map(q => Object.assign(q, {
        after: `<b class="big">Jibu: ${esc(q.answer)}</b><span class="muted">${esc(q.en)}</span>`
      }));
    }
    go(renderQ, { kind, mode: kind, practice, items, i: 0, score: 0, streak: 0, best: 0, correct: 0, results: [] });
  }

  function dotsHTML(G) {
    return `<div class="dots" aria-hidden="true">${G.items.map((_, k) => `<span class="${k < G.results.length ? (G.results[k] ? 'ok' : 'no') : k === G.i ? 'now' : ''}"></span>`).join('')}</div>`;
  }
  function topbar(G, label) {
    return `<div class="topbar"><button class="iconbtn" data-go="home" aria-label="Toka kwenye mchezo">${I.x}</button><span class="count">${label}</span><span class="chip flame ${G.streak > 1 ? 'on' : ''}" id="stk" title="Majibu sahihi mfululizo">${I.flame}${G.streak}</span></div>`;
  }
  function popStreak(G) {
    const el = $('#stk'); if (!el) return;
    el.innerHTML = `${I.flame}${G.streak}`; el.classList.toggle('on', G.streak > 1);
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = 'bump .5s';
  }
  function floater(host, text) {
    if (!host) return; const f = document.createElement('span'); f.className = 'floater'; f.textContent = text; host.appendChild(f);
    setTimeout(() => f.remove(), 1200);
  }

  function renderQ(G) {
    const q = G.items[G.i];
    const opts = shuffle(q.options);
    const T = 20000;
    const promptHTML = G.kind === 'methali' ? esc(q.prompt).replace('___', '<span class="blank" id="blank">&nbsp;</span>') : esc(q.prompt);
    app.innerHTML = `${ART.band()}<div class="screen">
      ${topbar(G, `${G.i + 1} / ${G.items.length}`)}
      ${dotsHTML(G)}
      ${G.practice ? '<span class="tag">Mazoezi · hakuna saa wala pointi</span>' : '<div class="timer" id="timer" aria-hidden="true"><i id="tbar"></i></div>'}
      ${G.kind === 'geo' ? `<div class="scene">${ART.mountains()}<span class="scene-label">${esc(q.eyebrow)}</span></div>` : ''}
      <div class="qcard" id="qcard"><span class="eyebrow">${G.kind === 'methali' ? 'Malizia methali' : 'Jiografia'}</span><p class="qtext">${promptHTML}</p></div>
      <div class="opts" id="opts">${opts.map((o, k) => `<button class="opt" style="--i:${k}" data-o="${esc(o)}"><span>${esc(o)}</span></button>`).join('')}</div>
      <div id="qfoot" class="stack"><button class="link" id="hint">Ondoa majibu mawili (−20)</button></div>
    </div>`;
    let stopT = null, startAt = performance.now(), hintUsed = false, answered = false;
    if (!G.practice) {
      const bar = $('#tbar'), tm = $('#timer');
      stopT = countdown(T, left => { bar.style.width = (left / T * 100) + '%'; tm.classList.toggle('low', left < 5000); }, () => answer(null));
    }
    $$('.opt').forEach(b => b.addEventListener('click', () => answer(b.dataset.o)));
    $('#hint').addEventListener('click', () => {
      if (hintUsed || answered) return; hintUsed = true;
      shuffle($$('.opt').filter(b => b.dataset.o !== q.answer)).slice(0, 2).forEach(b => { b.disabled = true; b.classList.add('gone'); });
      $('#hint').remove();
    });
    function answer(choice) {
      if (answered) return; answered = true; if (stopT) stopT();
      const ok = choice === q.answer;
      $$('.opt').forEach(b => {
        b.disabled = true;
        if (b.dataset.o === q.answer) { b.classList.add('correct'); b.insertAdjacentHTML('beforeend', I.check); }
        else if (b.dataset.o === choice) { b.classList.add('wrong'); b.insertAdjacentHTML('beforeend', I.x); }
      });
      if (G.kind === 'methali') { const bl = $('#blank'); bl.textContent = q.answer; bl.classList.add('fill'); }
      let pts = 0;
      if (ok) {
        G.streak++; G.best = Math.max(G.best, G.streak); G.correct++;
        const elapsed = performance.now() - startAt;
        pts = 100 + Math.min(100, (G.streak - 1) * 20) + (G.practice ? 0 : Math.round(50 * Math.max(0, T - elapsed) / T)) - (hintUsed ? 20 : 0);
        if (G.practice) pts = 0;
        G.score += pts;
        if (pts) floater($('#qcard'), `+${pts}`);
      } else G.streak = 0;
      popStreak(G);
      G.results.push(ok);
      const last = G.i === G.items.length - 1;
      const head = ok ? (G.streak > 2 ? `Moto! Majibu ${G.streak} mfululizo` : 'Sahihi!') : choice === null ? 'Muda umekwisha!' : 'Hapana, si hilo.';
      $('#qfoot').innerHTML = `<div class="feedback ${ok ? '' : 'bad'}"><b>${head}</b>${q.after}</div><button class="btn block" id="next">${last ? 'Ona matokeo' : 'Endelea'}</button>`;
      $('#next').focus({ preventScroll: true });
      $('#next').addEventListener('click', () => {

  /* ---------- mazao (hangman) ---------- */
  const LETTERS = 'ABCDEFGHIJKLMNOPRSTUVWYZ'.split('');
  function startMazao(practice) {
    const items = practice ? MAZAO.crops.filter(c => c.id === 'ndizi') : pick(MAZAO.crops, c => c.level, () => 0, 3, false);
    go(renderCrop, { kind: 'mazao', mode: 'mazao', practice, items, i: 0, score: 0, correct: 0, streak: 0, best: 0, results: [] });
  }
  function renderCrop(G) {
    const c = G.items[G.i], word = c.word, need = Array.from(new Set(word.split('')));
    const R = { got: new Set(), miss: new Set(), max: 6, hints: 0, done: false };
    app.innerHTML = `${ART.band()}<div class="screen">
      ${topbar(G, G.practice ? 'Mazoezi' : `Zao ${G.i + 1} / ${G.items.length}`)}
      ${dotsHTML(G)}
      <div class="crop" id="crop">${ART.crop(c.id)}<div class="drops" id="drops" aria-label="Matone ya maji yaliyobaki">${Array.from({ length: R.max }, () => I.drop).join('')}</div></div>
      <div class="slots" id="slots" aria-live="polite">${word.split('').map(() => '<span class="slot"></span>').join('')}</div>
      <div class="hints">
        <button class="hint" id="h-wapi">Linalimwa wapi? <span>Dokezo · −20</span></button>
        <button class="hint" id="h-nini">Linajulikana kwa nini? <span>Dokezo · −20</span></button>
      </div>
      <div class="kbd" id="kbd">${LETTERS.map(l => `<button class="key" data-k="${l}" aria-label="Herufi ${l}">${l}</button>`).join('')}</div>
      <div id="foot" class="stack"></div>
    </div>`;
    const svg = $('#crop svg');
    function paint() {
      const slots = $$('.slot');
      word.split('').forEach((ch, k) => { if (R.got.has(ch) && !slots[k].textContent) { slots[k].textContent = ch; slots[k].classList.add('show'); } });
      const frac = need.filter(ch => R.got.has(ch)).length / need.length;
      const startBlur = G.practice ? 0 : ({ chipukizi: 0, mjanja: 3, dingi: 6 }[S.profile.level] || 0);
      svg.style.filter = R.done || !startBlur ? 'none' : `blur(${(startBlur * (1 - frac)).toFixed(1)}px)`;
      $$('#drops svg').forEach((d, k) => d.classList.toggle('gone', k >= R.max - R.miss.size));
    }
    function openHint(id, text) {
      const b = $(id); if (b.classList.contains('open')) return;
      b.classList.add('open'); b.querySelector('span').textContent = text; R.hints++;
    }
    $('#h-wapi').addEventListener('click', () => { if (!R.done) openHint('#h-wapi', c.wapi); });
    $('#h-nini').addEventListener('click', () => { if (!R.done) openHint('#h-nini', c.nini); });
    function guess(l) {
      if (R.done || R.got.has(l) || R.miss.has(l)) return;
      const key = app.querySelector(`.key[data-k="${l}"]`);
      if (word.includes(l)) { R.got.add(l); key.classList.add('hit'); } else { R.miss.add(l); key.classList.add('miss'); }
      key.disabled = true; paint();
      const won = need.every(ch => R.got.has(ch)), lost = R.miss.size >= R.max;
      if (won || lost) finish(won);
    }
    function finish(won) {
      R.done = true; $$('.key').forEach(k => { k.disabled = true; });
      const slots = $$('.slot');
      word.split('').forEach((ch, k) => { if (!slots[k].textContent) { slots[k].textContent = ch; slots[k].classList.add('show', 'missed'); } });
      svg.style.filter = 'none';
      $('#crop').classList.add(won ? 'win' : 'wilt');
      let pts = 0;
      if (won) {
        G.streak++; G.best = Math.max(G.best, G.streak); G.correct++;
        pts = G.practice ? 0 : Math.max(20, 100 + 15 * (R.max - R.miss.size) + Math.min(100, (G.streak - 1) * 20) - 20 * R.hints);
        G.score += pts; if (pts) floater($('#crop'), `+${pts}`);
      } else G.streak = 0;
      popStreak(G); G.results.push(won);
      const last = G.i === G.items.length - 1;
      $('#foot').innerHTML = `<div class="feedback ${won ? '' : 'bad'}"><b class="big">${won ? `Safi! Ni ${c.word.toLowerCase()}.` : `Mmea umekauka! Jibu: ${c.word.toLowerCase()}.`}</b><span><b>Wapi:</b> ${esc(c.wapi)}</span><span><b>Kwa nini:</b> ${esc(c.nini)}</span><span class="muted">${esc(c.en)}: ${esc(c.en_fact)}</span></div><button class="btn block" id="next">${last ? 'Ona matokeo' : 'Zao linalofuata'}</button>`;
      $('#next').addEventListener('click', () => {
        if (last) go(scrResults, { mode: 'mazao', practice: G.practice, score: G.score, correct: G.correct, total: G.items.length, best: G.best, win: G.correct >= Math.ceil(G.items.length * .6) });
        else { G.i++; go(renderCrop, G); }
      });
    }
    $$('.key').forEach(k => k.addEventListener('click', () => guess(k.dataset.k)));
    const onKey = e => { const l = (e.key || '').toUpperCase(); if (l.length === 1 && LETTERS.includes(l)) guess(l); };
    document.addEventListener('keydown', onKey); addCleanup(() => document.removeEventListener('keydown', onKey));
    paint();
  }

    let strokes = [], cur = null, color = colors[0][0];
    function size() {
      const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); redraw();
    }
    function redraw() {
      const r = canvas.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      strokes.forEach(s => {
        ctx.strokeStyle = s.c; ctx.lineWidth = 6; ctx.beginPath();
        s.p.forEach((pt, k) => k ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1]));
        if (s.p.length === 1) ctx.lineTo(s.p[0][0] + .1, s.p[0][1]);

    }
    const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    canvas.addEventListener('pointerdown', e => { e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } cur = { c: color, p: [pos(e)] }; strokes.push(cur); redraw(); });
    canvas.addEventListener('pointermove', e => { if (!cur) return; cur.p.push(pos(e)); const p = cur.p, a = p[p.length - 2], b = p[p.length - 1]; ctx.strokeStyle = cur.c; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); });

    app.innerHTML = `${ART.band()}<div class="screen">
      <div class="stack"><span class="eyebrow">Msimu wa beta</span><h1 class="h1">Ligi ya ${month}</h1>
      <p class="lead">Mchujo unaanza tarehe 1. Siku ${days} zimebaki. Wachezaji 16 wa juu wanaingia mchujo.</p></div>
      <div class="table" role="list">
        ${rows.map((r, k) => `${k === 16 ? '<div class="cutline">Mstari wa mchujo</div>' : ''}<div class="lrow ${r.me ? 'me' : ''} ${k < 3 ? 'top' : ''}" role="listitem"><span class="n">${k + 1}</span>${r.me ? avatar(p, 'av xs') : `<span class="av xs">${ART.avatars[r.av].svg}</span>`}<span class="nm">${r.me ? `Wewe · ${esc(r.n)}` : esc(r.n)}</span><span class="pt">${fmt(r.pt)}</span></div>`).join('')}
      </div>
      <p class="fine">Wachezaji wengine ni wa mfano kwa toleo la beta.</p>
    </div>${nav('league')}`;
  }

  /* ---------- profile ---------- */
  function scrProfile() {
    const p = S.profile;
    app.innerHTML = `${ART.band()}<div class="screen">
      <div class="celebrate calm" style="padding-top:0">${avatar(p, 'av big')}<h1 class="h1">${esc(p.name)}</h1><span class="lvl">${levelName(p.level)}</span></div>
      <button class="btn ghost block" id="chav">${I.camera} Badilisha avatar au selfie</button>
      <div class="stats">
        <div class="stat"><b>${fmt(S.points)}</b><span>Pointi</span></div>
        <div class="stat"><b>${liveStreak()}</b><span>Siku mfululizo</span></div>
        <div class="stat"><b>${S.bestDays || 0}</b><span>Rekodi ya siku</span></div>
      </div>
      <dl class="ptable"><dt>Barua pepe</dt><dd>${esc(p.email)}</dd><dt>Umri</dt><dd>Miaka ${esc(p.age)}${p.age < 13 ? ' · ruhusa ya mzazi' : ''}</dd><dt>Michezo</dt><dd>${S.games}</dd></dl>
      <h2 class="h2">Kiwango</h2>
      <div class="choices" role="radiogroup" aria-label="Kiwango">
        ${LEVELS.map(l => `<label class="choice"><input type="radio" name="lvl" value="${l.id}" ${l.id === p.level ? 'checked' : ''}><span class="ctitle">${l.name}</span><span class="cen">${l.en}</span></label>`).join('')}
      </div>
      <div id="danger" class="stack"><button class="link" id="wipe">Futa data yangu na uanze upya</button></div>
    </div>${nav('profile')}`;
    $('#chav').addEventListener('click', () => go(scrAvatar, true));
    $$('input[name="lvl"]').forEach(r => r.addEventListener('change', () => { S.profile.level = r.value; save(); }));
    $('#wipe').addEventListener('click', () => {
      $('#danger').innerHTML = `<div class="confirm"><b>Futa kila kitu?</b><span>Pointi, mfululizo, selfie na wasifu wako vitafutwa kwenye kifaa hiki.</span><div class="btns"><button class="btn ghost small" id="no">Hapana</button><button class="btn small" id="yes">Ndiyo, futa</button></div></div>`;
      $('#no').addEventListener('click', () => go(scrProfile));
      $('#yes').addEventListener('click', () => { S = defaults(); save(); try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } go(scrKaribu); });
    });
  }

  /* ---------- confetti ---------- */
  function confetti() {
    if (reduced()) return;
    const c = document.getElementById('confetti'); if (!c) return;
    const ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
    const W = c.clientWidth, H = c.clientHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ['#C2362B', '#F2C230', '#2E7D4F', '#3F7F91', '#FBE4DE'];
    const parts = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 11, vy: -Math.random() * 12 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
    const t0 = performance.now(); let raf;
    const step = t => {
      ctx.clearRect(0, 0, W, H);
      parts.forEach(q => { q.vy += .32; q.vx *= .99; q.x += q.vx; q.y += q.vy; q.r += q.vr; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); ctx.restore(); });
      if (t - t0 < 3200) raf = requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
    };
    raf = requestAnimationFrame(step);
    addCleanup(() => { cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); });
  }

  /* ---------- boot ---------- */
  if (S.profile) go(scrHome);
  else if (S.draft && S.draft.level) go(scrAvatar, false);
  else if (S.draft && S.draft.name) go(scrLevel);
  else go(scrKaribu);
})();

</script>
</body>
